name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    # The existing test loads the full Spring context, which needs a real
    # database (no H2/Testcontainers in this project yet). Credentials
    # below match the local-dev defaults already in application.properties,
    # so no SPRING_DATASOURCE_* overrides are needed here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Uses the repo's own wrapper, same Maven version as local dev and
      # the Docker build (infra/docker/Dockerfile), nothing to keep in sync.
      - name: Build
        run: ./mvnw -B compile

      - name: Run tests
        run: ./mvnw -B test

  # SAST. Free for this repo since it's public (would need GitHub Advanced
  # Security to run this on a private repo). Findings show up in the
  # Security tab, not as a failed check, there's no baseline/triage done
  # yet on this codebase, hard-failing CI on day one of scanning would
  # make every future PR red for reasons unrelated to what it changed.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Manual build (not autobuild), same command as the Build and Test
      # job, so CodeQL analyzes exactly what actually gets shipped.
      - name: Build
        run: ./mvnw -B compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # Dependency vulnerability scanning. Trivy instead of OWASP
  # Dependency-Check (named in the original day-by-day plan): Dependency-
  # Check needs a free NVD API key to run at a usable speed, unmetered
  # it's severely rate-limited. Trivy needs no account or API key and is
  # just as legitimate a DevSecOps tool. Scans the built Spring Boot fat
  # jar rather than a bare pom.xml, so transitive dependencies bundled
  # under BOOT-INF/lib are actually visible to the scanner, not just the
  # directly declared ones.
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: ./mvnw -B package -DskipTests

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: target
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
