spring.application.name=sentinel-secscan

# Local-dev defaults, matching infra/docker-compose.yml. Override via the
# same-named environment variables for any other environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentinel}

# Flyway owns the schema (see src/main/resources/db/migration). Hibernate
# must never auto-create or alter tables, only validate they match.
spring.jpa.hibernate.ddl-auto=validate
