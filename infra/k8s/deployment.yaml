# Day 18: baseline, documentation-grade Deployment for the image
# infra/docker/Dockerfile builds. Applies to any Kubernetes cluster
# (including one provisioned by infra/terraform, or a local cluster for
# a demo), separate from that Terraform config on purpose, cluster
# provisioning and workload deployment are two different concerns. Not
# applied against a live cluster, see infra/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-app
  labels:
    app: sentinel
spec:
  # 2 replicas is a direct consequence of ADR 0003 (JWT over server-side
  # sessions): the API is fully stateless, so any replica can serve any
  # request, no shared session store needed to scale this out.
  replicas: 2
  selector:
    matchLabels:
      app: sentinel
  template:
    metadata:
      labels:
        app: sentinel
    spec:
      containers:
        - name: sentinel-app
          # Placeholder: a real deployment pipeline substitutes this with
          # the ecr_repository_url output from infra/terraform plus an
          # actual image tag, e.g. via Kustomize or CI templating, not
          # hand-edited here.
          image: "<ECR_REPOSITORY_URL>:latest"
          ports:
            - containerPort: 8080
          envFrom:
            # Not created or committed here. sentinel-secrets holds
            # SPRING_DATASOURCE_URL/USERNAME/PASSWORD and JWT_SECRET,
            # created out of band (kubectl create secret, or a real
            # secrets manager in production), the same "no secrets
            # committed to the repo" rule application.properties
            # already follows, and directly addresses finding I-2 in
            # docs/THREAT_MODEL.md (the dev-only JWT secret fallback):
            # a real deployment supplies JWT_SECRET here, it never falls
            # back to the value baked into application.properties.
            - secretRef:
                name: sentinel-secrets
          # /v3/api-docs is public and unauthenticated (Day 17), and
          # always available once the app has started, no new dependency
          # (e.g. Spring Actuator) needed just to give Kubernetes
          # something to probe.
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
